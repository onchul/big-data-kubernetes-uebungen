# Big Data WiSe 2026/27 – Vertiefungsthema Kubernetes
# Übung 2: Ausgangszustand – eine Anwendung mit drei Pods und einer festen Adresse.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0        # Es darf zu keinem Zeitpunkt ein Pod fehlen
      maxSurge: 2              # Es dürfen zwei zusätzliche Pods entstehen
  selector:
    matchLabels:
      app: shop
  template:
    metadata:
      labels:
        app: shop
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: web
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          readinessProbe:      # Erst wenn das hier klappt, bekommt der Pod Anfragen
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 1
            periodSeconds: 2
          lifecycle:
            preStop:           # Nach dem Abmelden noch kurz weiterbedienen,
              exec:            # damit laufende Anfragen nicht abbrechen
                command: ["sleep", "5"]
---
apiVersion: v1
kind: Service
metadata:
  name: shop
spec:
  type: NodePort
  selector:
    app: shop                  # Alle Pods mit diesem Label gehören dazu
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
